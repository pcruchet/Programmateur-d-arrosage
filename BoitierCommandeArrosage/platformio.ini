; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
[platformio]
default_envs = lolin32    ; ← Build/Upload n'utilise que lolin32 par défaut

[env:lolin32]
platform = espressif32@^6.13.0
board = lolin32
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps = 
    esp32async/ESPAsyncWebServer@^3.11.1
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit BusIO@^1.16.1
lib_ignore =
    RPAsyncTCP
    ESPAsyncTCP
build_flags =
    -Iinclude
build_src_filter = +<*> -<test_batterie_oled_main.cpp>   ; ← firmware principal : exclut le programme de test OLED batterie


[env:test_batterie_oled]
; Programme autonome : affiche l'etat de la batterie (INA219) sur l'OLED
; pendant 15s a chaque demarrage, puis deep sleep jusqu'au prochain appui
; sur BP2 (GPIO39). Pense pour l'observation en exterieur, sans moniteur
; serie. Reutilise AfficheurOLED et MesureBatteries de lib/, en vue d'une
; integration ulterieure dans BoitierPilotageArrosage.
; Flasher avec : pio run -e test_batterie_oled -t upload
platform = espressif32@^6.13.0
board = lolin32
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
lib_deps = 
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit BusIO@^1.16.1
lib_ignore =
    RPAsyncTCP
    ESPAsyncTCP
build_flags =
    -Iinclude
build_src_filter = +<*> -<main.cpp>   ; ← programme de test OLED batterie : exclut le firmware principal


[env:lolin32_test]
platform = espressif32@^6.13.0
board = lolin32
framework = arduino
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
monitor_speed = 115200
test_framework = unity
lib_deps = 
    esp32async/ESPAsyncWebServer@^3.11.1
    adafruit/Adafruit SSD1306@^2.5.17
    adafruit/RTClib@^2.1.4
    adafruit/Adafruit INA219@^1.2.3
    adafruit/Adafruit BusIO@^1.16.1
lib_ignore =
    RPAsyncTCP
    ESPAsyncTCP
build_flags =
    -Iinclude
build_src_filter = +<*> -<main.cpp> -<test_batterie_oled_main.cpp>   ; ← inclut tout sauf main.cpp et le programme de test OLED batterie

